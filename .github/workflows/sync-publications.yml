name: Sync publications

# Runs monthly (and on-demand, either via the "Run workflow" button or the
# admin tool's "Check Google Scholar" button) to check ORCID, Semantic
# Scholar, and — if a SERPAPI_KEY secret is configured — Google Scholar
# against the Publications section of index.html. If it finds a publication
# that isn't on the site yet, or a site entry missing a link that one of
# those sources has, it opens a pull request proposing the change — it never
# pushes to main directly, so nothing publishes without review. To change
# the schedule, edit the cron line below.
on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save

      - name: Run sync script
        id: sync
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node .github/scripts/sync-publications.js

      - name: Open pull request with proposed changes
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -e
          BRANCH="auto/sync-publications"

          # If last month's proposal is still open, leave it alone rather than
          # force-pushing over it — that could discard edits made while reviewing it.
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "An open PR already exists on $BRANCH — skipping until it's merged or closed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add index.html
          git commit -m "Sync publications from external sources"
          git push --force origin "$BRANCH"

          gh pr create \
            --title "Sync publications from external sources" \
            --body "$SUMMARY" \
            --base main \
            --head "$BRANCH"
